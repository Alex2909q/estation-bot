name: Exam 1843

# Сторож вільних талонів на практичний іспит у ТСЦ МВС № 1843 (Коростень).
# Кожен запуск живе ~5 год 40 хв і перевіряє чат з ТалонБотом кожні 15 хв;
# наприкінці ставить у чергу наступний запуск. Якщо колись зупиниться: Actions → Exam 1843 → Run workflow.
# Вимкнути (коли Оля записалася): Actions → Exam 1843 → ⋯ → Disable workflow.
on:
  push:
    branches: [main]
    paths: ["exam/**", ".github/workflows/exam.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовий режим: слати у ваше «Збережене», а не Олі"
        type: boolean
        default: false
  schedule:
    - cron: "11,41 * * * *"     # запасний запуск, якщо черга колись обірветься

permissions:
  contents: read
  actions: write      # постановка наступного запуску в чергу

concurrency:
  group: exam
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EXAM_SESSION: ${{ secrets.EXAM_SESSION }}
      EXAM_TALON_BOT: ${{ secrets.EXAM_TALON_BOT }}
      EXAM_RECIPIENT: "Голубоглазка Оля"
      EXAM_INTERVAL_MIN: "15"
      EXAM_RUN_MINUTES: "340"
      EXAM_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r exam/requirements.txt

      - name: Watch TalonBot
        run: python exam/watch.py

      - name: Queue the next run
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f /tmp/exam_healthy ]; then
            echo "::warning title=Exam 1843::Сторож не запустився (перевірте EXAM_SESSION / ТалонБот / контакт). Наступний запуск не ставлю."
            exit 0
          fi
          waiting=$(gh api "repos/$REPO/actions/workflows/exam.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$waiting" = "0" ]; then
            gh api -X POST "repos/$REPO/actions/workflows/exam.yml/dispatches" -f ref=main && echo "Наступний запуск поставлено"
          else
            echo "Наступний запуск уже в черзі"
          fi
