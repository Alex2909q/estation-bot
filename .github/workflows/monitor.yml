name: Monitor

# Перевірка каналів приблизно кожні 5 хвилин «естафетою»: кожен запуск наприкінці
# запускає наступний, а середовище pacer (таймер 4 хв, Settings → Environments)
# тримає його в очікуванні, не займаючи сервер. Пости між перевірками не губляться.
# Якщо естафета колись зупиниться: Actions → Monitor → Run workflow.
on:
  schedule:
    - cron: "0/5 * * * *"      # запасний варіант — GitHub для цього репозиторію його поки не виконує
  workflow_dispatch:
    inputs:
      relay:
        description: "Запуск естафети (з паузою 4 хв перед перевіркою)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write        # запуск наступної перевірки + щоденне продовження розкладу

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  pace:
    if: ${{ inputs.relay }}
    runs-on: ubuntu-latest
    environment: pacer
    timeout-minutes: 2
    steps:
      - run: echo "Пауза між перевірками минула"

  check:
    needs: pace
    if: ${{ !cancelled() && (needs.pace.result == 'success' || needs.pace.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      GITHUB_TOKEN: ${{ github.token }}
      TIMEZONE: Europe/Kyiv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon (only when TG_SESSION is set)
        if: env.TG_SESSION != ''
        run: pip install -q "telethon>=1.36"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check channels
        run: python github_run.py

      - name: Save state
        if: always() && hashFiles('state/changed') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pass the relay (next check in ~5 min)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          waiting=$(gh api "repos/$REPO/actions/workflows/monitor.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$waiting" != "0" ]; then
            echo "Наступна перевірка вже в черзі ($waiting)"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api -X POST "repos/$REPO/actions/workflows/monitor.yml/dispatches" -f ref=main -f "inputs[relay]=true"; then
              echo "Наступну перевірку заплановано"
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=EStation::Не вдалося запланувати наступну перевірку — запустіть Monitor вручну"
          exit 1
